name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npm run build

      - name: Gerar projeto Android
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
          chmod +x android/gradlew

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk controle-tv.apk
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest controle-tv.apk \
            --target "${{ github.sha }}" \
            --title "APK mais recente" \
            --notes "Baixe o arquivo controle-tv.apk e instale no Android. Gerado automaticamente a cada atualização do código."
